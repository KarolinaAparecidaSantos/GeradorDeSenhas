<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Senhas Aleatórias</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div class="container-de-senha">
      <h2>Gerador de Senhas Aleatórias</h2>
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
      />
      <div class="container-de-entrada">
        <input
          type="text"
          id="input"
          class="input"
          placeholder="Criar Senha"
          readonly
        />
        <i class="fa-regular fa-copy fa-2x"></i>
      </div>
      <button class="btn">Gerar senha</button>
    </div>
    <div class="container-de-alerta active">Senha copiada</div>
    <script src="index.js"></script>
    <!--parei em 39m:02s-->
  </body>
</html>
